name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest tests.test_core tests.test_service tests.test_filename_parser tests.test_import tests.test_metadata_rules tests.test_komga tests.test_komga_manifest -v
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: '"COMIC_MANAGE_PYTHON=$((Get-Command python).Source)" >> $env:GITHUB_ENV'
      - run: npm ci
      - run: npm run test:bridge
      - run: npm run build
      - run: npm run test:desktop
