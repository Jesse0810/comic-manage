name: Windows Electron portable build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: '"COMIC_MANAGE_PYTHON=$((Get-Command python).Source)" >> $env:GITHUB_ENV'
      - run: python -m pip install -r requirements-build.txt
      - run: npm ci
      - run: npm run test:core
      - run: npm run test:bridge
      - run: npm run build
      - run: npm run test:desktop
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: ComicManage-Electron-windows-x64
          path: release/*.zip
