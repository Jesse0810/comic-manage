name: Windows portable build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: ComicManage-v1-windows-x64
          path: dist/ComicManage-v1-windows-x64.zip
