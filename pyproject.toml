[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "comic-manage"
version = "1.5.0"
description = "Windows 本地漫画整理与 Kavita CBZ 元数据编辑器"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
build = ["PyInstaller==6.19.0"]
legacy-qt = ["PySide6-Essentials==6.10.2"]

[project.scripts]
comic-manage-service = "comic_manage.service:main"

[tool.setuptools.packages.find]
where = ["src"]
